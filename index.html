<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9fc8e8">
  <title>DR’s LEA Review Library | Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="login-container" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="presentation">
          <path d="M8 12.5 24 5l16 7.5v22L24 43 8 34.5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15 16h18M15 22h18M15 28h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <p class="eyebrow">YOUR ARCHITECTURE REVIEW SPACE</p>
      <h1 id="page-title">Welcome back.</h1>
      <p class="intro">Sign in and keep moving toward your license.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

        <div class="password-heading">
          <label for="password">Password</label>
        </div>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit">Login <span aria-hidden="true">→</span></button>
      </form>

      <p id="errorMessage" class="error" role="alert" aria-live="polite"></p>
      <p class="access-note"><span class="status-dot"></span> Private review library</p>
      <p class="footer-note">One topic at a time. You’ve got this, future architect.</p>
    </section>

    <section id="successMessage" class="success" aria-live="polite">
      <h1>Welcome in!</h1>
      <p>You have successfully logged in.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
